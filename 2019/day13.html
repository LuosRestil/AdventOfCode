<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: rgb(30, 30, 30);
      }
      canvas {
        image-rendering: pixelated;
        display: block;
      }
      #score {
        color: rgb(225, 225, 225);
        position: absolute;
        top: 20px;
        left: 20px;
        font: bold 40px monospace;
      }
      #ballPos {
        color: rgb(225, 225, 225);
        position: absolute;
        top: 60px;
        left: 20px;
        font: bold 24px monospace;
      }
    </style>
  </head>
  <body>
    <h3 id="score">Score: 0</h3>
    <h2 id="ballPos"></h2>
    <canvas></canvas>
    <script src="intcode.js" type="module"></script>
    <script type="module">
      import IntcodeComputer from "./intcode.js";

      let res = await fetch("inputs/day13.txt");
      let text = await res.text();
      let program = text.split(",").map((num) => parseInt(num));

      let canvas = document.querySelector("canvas");
      let ctx = canvas.getContext("2d");
      canvas.width = 38; // from day13.js output
      canvas.height = 21; // from day13.js output
      const scale = 20;
      canvas.style.width = `${canvas.width * scale}px`;
      canvas.style.height = `${canvas.height * scale}px`;
      let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      let pixels = imageData.data;

      let scoreEl = document.getElementById("score");
      let ballPosEl = document.getElementById("ballPos");

      let grid = Array(canvas.height)
        .fill(null)
        .map(() => Array(canvas.width).fill(0));

      let computer = new IntcodeComputer(program, []);
      computer.state[0] = 2;
      let score = 0;
      let lastBallPos = [16, 15];
      let ballPos, paddleX;
      let colors = [
        [0, 0, 0],
        [100, 50, 50],
        [0, 200, 100],
        [225, 225, 225],
        [225, 225, 0],
      ];
      const [EMPTY, WALL, BRICK, PADDLE, BALL] = [0, 1, 2, 3, 4];

      requestAnimationFrame(loop);

      let elapsed = 0;
      let lastTimestamp = 0;
      let framerate = 1 / 120;

      function loop(timestamp) {
        const dt = (timestamp - lastTimestamp) / 1000;
        lastTimestamp = timestamp;
        elapsed += dt;
        if (elapsed >= framerate) {
          elapsed -= framerate;
          tick();
          drawGrid();
        }

        requestAnimationFrame(loop);
      }

      function tick() {
        if (computer.status === IntcodeComputer.STATUS_DONE) return;
        computer.run();

        while (computer.outputs.length) {
          let x = computer.outputs.shift();
          let y = computer.outputs.shift();
          let value = computer.outputs.shift();

          if (x === -1 && y === 0) {
            computer.score = value;
            scoreEl.textContent = "Score: " + computer.score;
          } else {
            grid[y][x] = value;
            if (value === BALL) {
              ballPos = [x, y];
            }
            if (value === PADDLE) {
              paddleX = x;
            }
          }
        }
        let paddleTargetX = simulate(copyGrid(grid), ballPos, lastBallPos);
        if (paddleTargetX === null) return;
        console.log(paddleTargetX, paddleX);

        lastBallPos = ballPos;
        if (paddleTargetX < paddleX) {
          computer.inputs.push(-1);
        } else if (paddleTargetX > paddleX) {
          computer.inputs.push(1);
        } else {
          computer.inputs.push(0);
        }
      }

      function simulate(grid, ballPos, lastBallPos) {
        let vel = [ballPos[0] - lastBallPos[0], ballPos[1] - lastBallPos[1]];
        if (vel[0] === 0 && vel[1] === 0) return null;
        let curr = [ballPos[0], ballPos[1]];
        while (true) {
          if (curr[1] > grid.length - 4 && vel[1] === 1) {
            break;
          }
          while (true) {
            if (vel[0] === -1) {
              let left = grid[curr[1]][curr[0] - 1];
              if (left) {
                vel[0] *= -1;
                if (left === BRICK) {
                  grid[curr[1]][curr[0] - 1] = EMPTY;
                }
                continue;
              }
            }
            if (vel[1] === -1) {
              let up = grid[curr[1] - 1][curr[0]];
              if (up) {
                vel[1] *= -1;
                if (up === BRICK) {
                  grid[curr[1] - 1][curr[0]] = EMPTY;
                }
                continue;
              }
            }
            if (vel[0] === 1) {
              let right = grid[curr[1]][curr[0] + 1];
              if (right) {
                vel[0] *= -1;
                if (right === BRICK) {
                  grid[curr[1]][curr[0] + 1] = EMPTY;
                }
                continue;
              }
            }
            if (vel[1] === 1) {
              let down = grid[curr[1] + 1][curr[0]];
              if (down) {
                vel[1] *= -1;
                if (down === BRICK) {
                  grid[curr[1] + 1][curr[0]] = EMPTY;
                }
                continue;
              }
            }
            let corner = grid[curr[1] + vel[1]][curr[0] + vel[0]];
            if (corner) {
              if (corner === BRICK) {
                grid[curr[1] + vel[1]][curr[0] + vel[0]] = EMPTY;
                vel[0] *= -1;
                vel[1] *= -1;
                continue;
              }
              vel[0] *= -1;
              vel[1] *= -1;
            }
            curr = [curr[0] + vel[0], curr[1] + vel[1]];
            break;
          }
        }
        return curr[0];
      }

      function setPixel(x, y, r, g, b) {
        let idx = y * (canvas.width * 4) + x * 4;
        pixels[idx] = r;
        pixels[idx + 1] = g;
        pixels[idx + 2] = b;
        pixels[idx + 3] = 255;
      }

      function drawGrid() {
        for (let y = 0; y < grid.length; y++) {
          for (let x = 0; x < grid[0].length; x++) {
            let value = grid[y][x];
            let color = colors[value];
            setPixel(x, y, color[0], color[1], color[2]);
          }
        }
        ctx.putImageData(imageData, 0, 0);
      }

      function copyGrid() {
        let copy = Array(grid.length)
          .fill(null)
          .map(() => Array(grid[0].length).fill(0));
        for (let y = 0; y < grid.length; y++) {
          for (let x = 0; x < grid[0].length; x++) {
            copy[y][x] = grid[y][x];
            if (copy[y][x] === BALL) {
              copy[y][x] = EMPTY;
            }
          }
        }
        return copy;
      }
    </script>
  </body>
</html>
