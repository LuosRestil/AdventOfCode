<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
        }
      }
    </script>
    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";

      let colors = [
        "red",
        "orange",
        "yellow",
        "green",
        "blue",
        "indigo",
        "violet",
      ];

      let res = await fetch("inputs/day22sample.txt");
      let text = await res.text();
      let blocks = text
        .split("\n")
        .map((row, idx) => {
          const [l, r] = row
            .split("~")
            .map((side) => side.split(",").map((num) => parseInt(num)));
          let left = l[0];
          let right = r[0] + 1;
          let front = l[1];
          let back = r[1] + 1;
          let bottom = l[2];
          let top = r[2] + 1;
          return {
            left,
            right,
            front,
            back,
            bottom,
            top,
            color: colors[idx],
          };
        })
        .toSorted((a, b) => a.bottom - b.bottom);

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000,
      );

      const renderer = new THREE.WebGLRenderer();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      document.body.appendChild(renderer.domElement);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 0, 0);
      controls.update();

      controls.addEventListener("change", () => renderer.render(scene, camera));

      const ambientColor = 0xffffff;
      const ambientIntensity = 0.25;
      const ambientLight = new THREE.AmbientLight(
        ambientColor,
        ambientIntensity,
      );
      scene.add(ambientLight);

      const color = 0xffffff;
      const intensity = 1;
      const light = new THREE.DirectionalLight(color, intensity);
      light.position.set(0, 10, 0);
      light.target.position.set(-5, 0, 0);
      light.castShadow = true;
      scene.add(light);
      scene.add(light.target);

      for (let block of blocks) {
        const geometry = new THREE.BoxGeometry(
          block.right - block.left,
          block.top - block.bottom,
          block.back - block.front,
        );
        const material = new THREE.MeshLambertMaterial({ color: block.color });
        // material.color.setRGB(Math.random(), Math.random(), Math.random());
        const cube = new THREE.Mesh(geometry, material);
        cube.castShadow = true;
        cube.receiveShadow = true;
        cube.position.x = (block.right + block.left) / 2;
        cube.position.y = (block.top + block.bottom) / 2;
        cube.position.z = (block.front + block.back) / 2;
        scene.add(cube);
        block.mesh = cube;
      }

      const planeGeo = new THREE.PlaneGeometry(10, 10);
      const planeMat = new THREE.MeshLambertMaterial({
        side: THREE.DoubleSide,
      });
      planeMat.color.setRGB(0.2, 0.2, 0.2);
      const floor = new THREE.Mesh(planeGeo, planeMat);
      floor.position.y = 1;
      floor.rotation.x = Math.PI * -0.5;
      floor.receiveShadow = true;
      scene.add(floor);

      camera.position.x = 9.227355885814708;
      camera.position.y = 9.648553239686843;
      camera.position.z = 7.272209071083875;

      camera.lookAt(0, 0, 0);

      renderer.render(scene, camera);

      document.addEventListener("keyup", async (evt) => {
        if (evt.key !== "k") return;
        for (let block of blocks) {
          while (canDrop(block, blocks)) {
            drop(block);
            await sleep(1000);
            renderer.render(scene, camera);
          }
        }
      });

      function canDrop(block, blocks) {
        if (block.bottom === 1) return false;
        let below = blocks.filter((other) => other.top === block.bottom);
        for (let other of below) {
          if (xyOverlap(block, other)) {
            return false;
          }
        }
        return true;
      }

      function isSupport(block, blocks) {
        let above = blocks.filter((other) => other.bottom === block.top);
        for (let other of above) {
          if (xyOverlap(block, other)) {
            return true;
          }
        }
        return false;
      }

      function xyOverlap(a, b) {
        return !(
          a.left > b.right ||
          a.right < b.left ||
          a.front > b.back ||
          a.back < b.front
        );
      }

      function drop(block) {
        block.bottom--;
        block.top--;
        block.mesh.position.y -= 1;
      }

      function sleep(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
      }
    </script>
  </body>
</html>
