<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2018 Day 13</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: rgb(30, 30, 30);
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas></canvas>
    <script type="module">
      let canvas = document.querySelector("canvas");
      let ctx = canvas.getContext("2d");

      let res = await fetch("inputs/day13.txt");
      let text = await res.text();
      const grid = text.split("\n").map((row) => row.split(""));
      let dim = grid.length;
      let screenSize = Math.min(window.innerWidth, window.innerHeight);
      canvas.width = screenSize * window.devicePixelRatio;
      canvas.height = screenSize * window.devicePixelRatio;
      canvas.style.width = screenSize + "px";
      canvas.style.height = screenSize + "px";
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
      ctx.strokeStyle = "rgb(80,80,80)";
      ctx.lineWidth = 2;
      let cellSize = screenSize / dim;
      let carts = [];
      let cartTypes = new Set(["^", ">", "v", "<"]);
      let turns = [turnLeft, (dir) => dir, turnRight];
      let cartDirs = {
        "^": { x: 0, y: -1 },
        ">": { x: 1, y: 0 },
        v: { x: 0, y: 1 },
        "<": { x: -1, y: 0 },
      };
      for (let row = 0; row < grid.length; row++) {
        for (let col = 0; col < grid[0].length; col++) {
          if (cartTypes.has(grid[row][col])) {
            let dir = cartDirs[grid[row][col]];
            carts.push({
              x: col,
              y: row,
              dir: { x: dir.x, y: dir.y },
              nextTurn: 0,
              destroyed: false,
            });
            if (grid[row][col] === "<" || grid[row][col] === ">") {
              grid[row][col] = "-";
            } else {
              grid[row][col] = "|";
            }
          }
        }
      }

      let firstCollisionLoc = null;
      let lastCartLoc = null;

      let elapsed = 0;
      let framerate = 1 / 120;
      let lastTimestamp = 0;

      requestAnimationFrame(loop);

      function loop(timestamp) {
        elapsed += (timestamp - lastTimestamp) / 1000;
        lastTimestamp = timestamp;
        if (elapsed >= framerate) {
          elapsed -= framerate;
          update();
          draw();
          if (!lastCartLoc) {
            requestAnimationFrame(loop);
          } else {
            ctx.strokeStyle = "black";
            ctx.lineWidth = 4;
            ctx.fillStyle = "dodgerblue";
            ctx.font = "bold 24px monospace";
            ctx.strokeText(
              `First collision: ${firstCollisionLoc.x}, ${firstCollisionLoc.y}`,
              10,
              30,
            );
            ctx.strokeText(
              `Last cart: ${lastCartLoc.x}, ${lastCartLoc.y}`,
              10,
              60,
            );
            ctx.strokeText(
              `Took ${Math.round(timestamp / 1000)} seconds`,
              10,
              90,
            );
            ctx.fillText(
              `First collision: ${firstCollisionLoc.x}, ${firstCollisionLoc.y}`,
              10,
              30,
            );
            ctx.fillText(
              `Last cart: ${lastCartLoc.x}, ${lastCartLoc.y}`,
              10,
              60,
            );
            ctx.fillText(
              `Took ${Math.round(timestamp / 1000)} seconds`,
              10,
              90,
            );
          }
        } else {
          requestAnimationFrame(loop);
        }
      }

      function update() {
        sortCarts();
        tick();
        if (!firstCollisionLoc) {
          let destroyed = carts.filter((cart) => cart.destroyed);
          if (destroyed.length) {
            firstCollisionLoc = { x: destroyed[0].x, y: destroyed[0].y };
          }
        }
        let notDestroyed = carts.filter((cart) => !cart.destroyed);
        if (notDestroyed.length === 1) {
          lastCartLoc = { x: notDestroyed[0].x, y: notDestroyed[0].y };
        }
      }

      function draw() {
        ctx.fillStyle = "white";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        for (let row = 0; row < dim; row++) {
          for (let col = 0; col < dim; col++) {
            let cell = { y: row * cellSize, x: col * cellSize };
            let char = grid[row][col];
            switch (char) {
              case "-":
                drawLine(
                  cell.x,
                  cell.y + cellSize / 2,
                  cell.x + cellSize,
                  cell.y + cellSize / 2,
                );
                break;
              case "|":
                drawLine(
                  cell.x + cellSize / 2,
                  cell.y,
                  cell.x + cellSize / 2,
                  cell.y + cellSize,
                );
                break;
              case "\\":
                drawLine(cell.x, cell.y, cell.x + cellSize, cell.y + cellSize);
                break;
              case "/":
                drawLine(cell.x, cell.y + cellSize, cell.x + cellSize, cell.y);
                break;
              case "+":
                drawLine(
                  cell.x,
                  cell.y + cellSize / 2,
                  cell.x + cellSize,
                  cell.y + cellSize / 2,
                );
                drawLine(
                  cell.x + cellSize / 2,
                  cell.y,
                  cell.x + cellSize / 2,
                  cell.y + cellSize,
                );
                break;
            }
          }
        }
        for (let cart of carts) {
          drawCart(cart);
        }
      }

      function tick() {
        for (let cart of carts) {
          if (cart.destroyed) continue;
          // move
          cart.x += cart.dir.x;
          cart.y += cart.dir.y;

          // turn
          let char = grid[cart.y][cart.x];
          switch (char) {
            case "+":
              turns[cart.nextTurn](cart.dir);
              cart.nextTurn = (cart.nextTurn + 1) % 3;
              break;
            case "\\":
              if (cart.dir.y) turnLeft(cart.dir);
              else if (cart.dir.x) turnRight(cart.dir);
              break;
            case "/":
              if (cart.dir.x) turnLeft(cart.dir);
              else if (cart.dir.y) turnRight(cart.dir);
              break;
            default:
              break;
          }
          // check collisions
          for (let other of carts) {
            if (cart === other || other.destroyed) continue;
            if (cart.x === other.x && cart.y === other.y) {
              cart.destroyed = true;
              other.destroyed = true;
            }
          }
        }
      }

      function turnLeft(dir) {
        if (dir.x === 0) {
          dir.x = dir.y;
          dir.y = 0;
        } else {
          dir.y = -dir.x;
          dir.x = 0;
        }
      }

      function turnRight(dir) {
        if (dir.x === 0) {
          dir.x = -dir.y;
          dir.y = 0;
        } else {
          dir.y = dir.x;
          dir.x = 0;
        }
      }

      function sortCarts() {
        carts.sort((a, b) => {
          if (a.y === b.y) {
            return a.x - b.x;
          }
          return a.y - b.y;
        });
      }

      function drawLine(x1, y1, x2, y2) {
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
      }

      function drawCart(cart) {
        if (cart.destroyed) {
          ctx.fillStyle = "red";
        } else {
          ctx.fillStyle = "green";
        }

        ctx.save();
        ctx.translate(cart.x * cellSize + cellSize / 2, cart.y * cellSize + cellSize / 2);

        // circles
        // ctx.beginPath();
        // ctx.arc(0, 0, cellSize * 0.75, 0, Math.PI * 2);
        // ctx.fill();

        // triangles
        if (cart.dir.x !== 1) {
          ctx.rotate(Math.atan2(cart.dir.y, cart.dir.x));
        }
        ctx.beginPath();
        ctx.moveTo(cellSize * 1.75, 0);
        ctx.lineTo(-cellSize, -cellSize * 0.8);
        ctx.lineTo(-cellSize, cellSize * 0.8);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
      }
    </script>
  </body>
</html>
