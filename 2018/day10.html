<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2018 Day 10</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: rgb(30, 30, 30);
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas></canvas>
    <script type="module">
      let canvas = document.querySelector("canvas");
      canvas.width = window.innerWidth * window.devicePixelRatio;
      canvas.height = window.innerHeight * window.devicePixelRatio;
      let width = window.innerWidth;
      let height = window.innerHeight;
      canvas.style.width = width + "px";
      canvas.style.height = height + "px";
      let ctx = canvas.getContext("2d");
      ctx.scale(devicePixelRatio, devicePixelRatio);

      ctx.fillStyle = "rgb(180, 180, 180)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = "32px monospace";
      ctx.fillStyle = "rgb(50,50,50)";
      ctx.fillText(
        "Press any key to advance simulation",
        width / 2,
        height / 2,
      );

      let res = await fetch("inputs/day10.txt");
      let text = await res.text();
      let points = text.split("\n").map((row) => {
        let matches = [...row.matchAll(/<(.+?)>/g)];
        let pos = matches[0][1]
          .trimStart()
          .split(/,\s+/)
          .map((num) => parseInt(num));
        let vel = matches[1][1]
          .trimStart()
          .split(/,\s+/)
          .map((num) => parseInt(num));
        return { pos, vel };
      });

      let lastTimestamp = 0;

      let iterations = 0;
      while (
        !points.every(
          (point) =>
            point.pos[0] > 0 &&
            point.pos[1] > 0 &&
            point.pos[0] < canvas.width &&
            point.pos[1] < canvas.height,
        )
      ) {
        iterations++;
        for (let point of points) {
          point.pos[0] += point.vel[0];
          point.pos[1] += point.vel[1];
        }
      }

      let looping = true;
      document.addEventListener("keypress", (evt) => {
        tick();
      });

      function tick() {
        iterations++;
        ctx.fillStyle = "rgb(180, 180, 180)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        for (let point of points) {
          point.pos[0] += point.vel[0];
          point.pos[1] += point.vel[1];
        }

        ctx.fillStyle = "black";
        for (let point of points) {
          ctx.fillRect(point.pos[0], point.pos[1], 1, 1);
        }

        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.font = "32px monospace";
        ctx.fillStyle = "rgb(30,30,30)";
        ctx.fillText(
          "Press any key to advance simulation",
          width / 2,
          height / 2,
        );

        ctx.textAlign = "right";
        ctx.textBaseline = "top";
        ctx.font = "24px monospace";
        ctx.fillText("iterations: " + iterations, width - 20, 20);
      }
    </script>
  </body>
</html>
