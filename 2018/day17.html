<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2018 Day 17</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 100vw;
        height: 100vh;
        background-color: rgb(30, 30, 30);
      }
      canvas {
        display: block;
        margin: auto;
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <canvas></canvas>
    <script type="module">
      let canvas = document.querySelector("canvas");
      let ctx = canvas.getContext("2d");

      let wallsByX = {};
      let floorsByY = {};
      let allWalls = [];
      let allFloors = [];
      let minY = Infinity;
      let maxY = -Infinity;
      const res = await fetch("inputs/day17.txt");
      const text = await res.text();
      text.split("\n").forEach((row) => {
        let halves = row.split(", ");
        if (halves[0].startsWith("x")) {
          // wall
          let x = parseInt(halves[0].slice(2));
          let yRange = halves[1]
            .slice(2)
            .split("..")
            .map((num) => parseInt(num));
          let wall = { x, top: yRange[0], bottom: yRange[1] };
          if (!wallsByX[x]) {
            wallsByX[x] = [];
          }
          wallsByX[x].push(wall);
          allWalls.push(wall);
          if (yRange[0] < minY) minY = yRange[0];
          if (yRange[1] > maxY) maxY = yRange[1];
        } else {
          // floor
          let y = parseInt(halves[0].slice(2));
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
          let xRange = halves[1]
            .slice(2)
            .split("..")
            .map((num) => parseInt(num));
          let floor = { y, left: xRange[0], right: xRange[1] };
          if (!floorsByY[y]) {
            floorsByY[y] = [];
          }
          floorsByY[y].push(floor);
          allFloors.push(floor);
        }
      });
      let floorYs = Object.keys(floorsByY).toSorted((a, b) => a - b);
      let wallXs = Object.keys(wallsByX).toSorted((a, b) => a - b);

      const EMPTY = 0;
      const SOLID = 1;
      const WATER = 2;
      const CLICKED = 3;
      let WIDTH = 1000;
      let HEIGHT = maxY + 1;
      canvas.width = WIDTH;
      canvas.height = HEIGHT;

      let imageData = ctx.getImageData(0, 0, WIDTH, HEIGHT);
      let pixels = imageData.data;

      let grid = [];
      for (let y = 0; y < HEIGHT; y++) {
        let row = [];
        for (let x = 0; x < WIDTH; x++) {
          row.push(EMPTY);
        }
        grid.push(row);
      }
      for (let wall of allWalls) {
        for (let y = wall.top; y <= wall.bottom; y++) {
          grid[y][wall.x] = SOLID;
        }
      }
      for (let floor of allFloors) {
        for (let x = floor.left; x <= floor.right; x++) {
          grid[floor.y][x] = SOLID;
        }
      }

      let streams = [{ x: 500, top: minY }];

      draw();

      let debug = false;

      document.addEventListener("keypress", (evt) => {
        evt.preventDefault();
        if (evt.key === "k") {
          tick();
          draw();
        } else if (evt.key === "l") {
          debug = !debug;
        } else if (evt.key === 'w') {
          countWater();
        }
      });

      let anchor = null;
      document.addEventListener("click", (evt) => {
        if (!evt.shiftKey) {
          anchor = {x: evt.layerX, y: evt.layerY};
          grid[anchor.y][anchor.x] = CLICKED;
        } else {
          if (!anchor) return;
          for (let x = anchor.x; x <= evt.layerX; x++) {
            for (let y = anchor.y; y <= evt.layerY; y++) {
              grid[y][x] = CLICKED;
            }
          }
          anchor = {x: evt.layerX, y: evt.layerY};
        }
        draw();
      });


      function tick() {
        // TODO handle stream landing in water over wall inside a pool
        // if landed in water, walk left and right. if you ever hit an empty place, you can stop
        // TODO handle overflow into existing stream path (walking through and out the other side because down is not empty, but water...)

        if (!streams.length) {
          // TODO show end stats
          console.log("DONE!!!");

          return;
        }
        let stream = streams.pop();
        if (grid[stream.top][stream.x] === WATER) return;
        let currY = stream.top;
        // fall to nearest floor or wall (or water)
        while (currY <= maxY && grid[currY][stream.x] === EMPTY) {
          grid[currY][stream.x] = WATER;
          currY++;
        }
        if (currY > maxY) {
          return;
        }

        // if wall, add two new streams and be done with the current stream
        let landedInWater = grid[currY][stream.x] === WATER;
        if (landedInWater) {
          let wall = wallsByX[stream.x]?.find((wall) => wall.top === currY + 1);
          if (wall) {
            // we've already landed on this wall before, no need to repeat
            return;
          }
        } else {
          // solid
          let wall = wallsByX[stream.x]?.find((wall) => wall.top === currY);
          if (wall) {
            grid[currY - 1][stream.x - 1] = WATER;
            grid[currY - 1][stream.x + 1] = WATER;
            streams.push({ x: stream.x - 1, top: currY });
            streams.push({ x: stream.x + 1, top: currY });
            return;
          }
        }
        // bz we have NOT necessarily landed above a floor here
        // it's possible we landed in water far above a wall
        // in which case, when we look down, we'll hit a WALL, not a FLOOR
        // and nearestFloor will be undefined
        // landed above floor, figure out which one we landed on
        let iy = currY;
        if (landedInWater) {
          while (iy <= maxY && grid[iy][stream.x] !== SOLID) {
            iy++;
          }
        }
        if (iy > maxY) return;

        let nearestFloor = floorsByY[iy]?.find(
          (floor) => floor.left <= stream.x && floor.right >= stream.x,
        );
        if (!nearestFloor) {
          // we landed in water far above a wall
          return;
        }

        currY--;

        // find left and right walls
        let validWalls = allWalls
          .filter(
            (wall) =>
              wall.x >= nearestFloor.left && wall.x <= nearestFloor.right, // TODO nearestFloor undefined
          )
          .toSorted((a, b) => a.x - b.x);
        let boundingWalls = validWalls.filter(
          (wall) => wall.bottom >= currY && wall.top <= currY,
        );
        let leftWall = boundingWalls.find((wall) => wall.x < stream.x);
        let rightWall = boundingWalls.find((wall) => wall.x > stream.x);
        if (landedInWater && !(!!leftWall && !!rightWall)) {
          // landed in already explored runoff
          return;
        }

        let hitWallLeft = true;
        let hitWallRight = true;
        let lastLeftWallX = -Infinity;
        let lastRightWallX = Infinity;
        while (hitWallLeft && hitWallRight) {
          hitWallLeft = false;
          hitWallRight = false;
          // walk left
          let currX = stream.x;
          while (true) {
            if (
              currX ===
                Math.min(
                  lastLeftWallX - 1,
                  (nearestFloor?.left ?? Infinity) - 1,
                ) &&
              grid[currY][currX] === WATER
            ) {
              break;
            }
            if (grid[currY][currX] === SOLID) {
              hitWallLeft = true;
              lastLeftWallX = currX;
              break;
            }
            grid[currY][currX] = WATER;
            if (grid[currY + 1][currX] === EMPTY) {
              streams.push({ x: currX, top: currY + 1 });
              break;
            }
            currX--;
          }
          // walk right
          currX = stream.x;
          while (true) {
            if (
              currX ===
                Math.max(
                  lastRightWallX + 1,
                  (nearestFloor?.right ?? -Infinity) + 1,
                ) &&
              grid[currY][currX] === WATER
            ) {
              break;
            }
            if (grid[currY][currX] === SOLID) {
              hitWallRight = true;
              lastRightWallX = currX;
              break;
            }
            grid[currY][currX] = WATER;
            if (grid[currY + 1][currX] === EMPTY) {
              streams.push({ x: currX, top: currY + 1 });
              break;
            }
            currX++;
          }
          currY--;
        }
      }

      function draw() {
        for (let y = 0; y < grid.length; y++) {
          for (let x = 0; x < grid[0].length; x++) {
            let type = grid[y][x];
            if (type === SOLID) {
              setPixel(x, y, 50, 50, 50);
            } else if (type === WATER) {
              setPixel(x, y, 30, 144, 255);
            } else if (type === EMPTY) {
              setPixel(x, y, 180, 180, 180);
            } else if (type === CLICKED) {
              setPixel(x, y, 255, 0, 0);
            }
          }
        }

        for (let i = 0; i < streams.length; i++) {
          let stream = streams[i];
          if (i === streams.length - 1) {
            setPixel(stream.x, stream.top, 0, 255, 0);
          } else {
            setPixel(stream.x, stream.top, 255, 255, 0);
          }
        }

        ctx.putImageData(imageData, 0, 0);
      }

      function setPixel(x, y, r, g, b) {
        let idx = y * (WIDTH * 4) + x * 4;
        pixels[idx] = r;
        pixels[idx + 1] = g;
        pixels[idx + 2] = b;
        pixels[idx + 3] = 255;
      }

      function getPixel(x, y) {
        let idx = y * (WIDTH * 4) + x * 4;
        return [pixels[idx], pixels[idx + 1], pixels[idx + 2]];
      }

      function countWater(x, y) {
        let total = 0;
        for (let row of grid) {
          for (let col of row) {
            if (col === WATER) {
              total++;
            }
          }
        }
        console.log(`total water: ${total}`);
      }
    </script>
  </body>
</html>
