<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2018 Day 17</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 100vw;
        height: 100vh;
        background-color: rgb(30, 30, 30);
      }
      canvas {
        display: block;
        margin: auto;
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <canvas></canvas>
    <script type="module">
      let canvas = document.querySelector("canvas");
      let ctx = canvas.getContext("2d");

      let wallsByX = {};
      let floorsByY = {};
      let allWalls = [];
      let allFloors = [];
      let minY = Infinity;
      let maxY = -Infinity;
      const res = await fetch("inputs/day17.txt");
      const text = await res.text();
      text.split("\n").forEach((row) => {
        let halves = row.split(", ");
        if (halves[0].startsWith("x")) {
          // wall
          let x = parseInt(halves[0].slice(2));
          let yRange = halves[1]
            .slice(2)
            .split("..")
            .map((num) => parseInt(num));
          let wall = { x, top: yRange[0], bottom: yRange[1] };
          if (!wallsByX[x]) {
            wallsByX[x] = [];
          }
          wallsByX[x].push(wall);
          allWalls.push(wall);
          if (yRange[0] < minY) minY = yRange[0];
          if (yRange[1] > maxY) maxY = yRange[1];
        } else {
          // floor
          let y = parseInt(halves[0].slice(2));
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
          let xRange = halves[1]
            .slice(2)
            .split("..")
            .map((num) => parseInt(num));
          let floor = { y, left: xRange[0], right: xRange[1] };
          if (!floorsByY[y]) {
            floorsByY[y] = [];
          }
          floorsByY[y].push(floor);
          allFloors.push(floor);
        }
      });
      let floorYs = Object.keys(floorsByY).toSorted((a, b) => a - b);
      let wallXs = Object.keys(wallsByX).toSorted((a, b) => a - b);

      const EMPTY = 0;
      const SOLID = 1;
      const WATER = 2;
      let types = [EMPTY, SOLID, WATER];
      let WIDTH = 1000;
      let HEIGHT = maxY + 1;
      canvas.width = WIDTH;
      canvas.height = HEIGHT;

      let imageData = ctx.getImageData(0, 0, WIDTH, HEIGHT);
      let pixels = imageData.data;

      let grid = [];
      for (let y = 0; y < HEIGHT; y++) {
        let row = [];
        for (let x = 0; x < WIDTH; x++) {
          row.push(EMPTY);
        }
        grid.push(row);
      }
      for (let wall of allWalls) {
        for (let y = wall.top; y <= wall.bottom; y++) {
          grid[y][wall.x] = SOLID;
        }
      }
      for (let floor of allFloors) {
        for (let x = floor.left; x <= floor.right; x++) {
          grid[floor.y][x] = SOLID;
        }
      }

      let streams = [{ x: 500, top: minY }];
      let stream = streams.pop();
      let currY, currX, falling, seekDir, hasLeftWall, hasRightWall;
      let done = false;
      resetState();

      let shouldLoop = true;
      document.addEventListener("keypress", () => {
        shouldLoop = !shouldLoop;
        if (shouldLoop) {
          requestAnimationFrame(loop);
        }
      });

      let framerate = 1 / 120;
      let elapsed = 0;
      let lastTimestamp = 0;

      requestAnimationFrame(loop);
      function loop(timestamp) {
        let dt = Math.min(0.1, (timestamp - lastTimestamp) / 1000);
        elapsed += dt;
        lastTimestamp = timestamp;
        if (elapsed >= framerate) {
          elapsed -= framerate;
          update();
          draw();
        }

        if (shouldLoop) {
          requestAnimationFrame(loop);
        }
      }

      function update() {
        if (done) return;

        if (falling) {
          if (grid[currY][stream.x] === EMPTY && currY <= maxY) {
            grid[currY][stream.x] = WATER;
            currY++;
            if (currY > maxY) {
              if (streams.length) {
                stream = streams.pop();
                resetState();
              } else {
                done = true;
              }
            }
          } else {
            currY--;
            falling = false;
          }
          return;
        }

        // seek left and right for walls and drops

        let hasLeftWall = false;
        let hasRightWall = false;
        currX = stream.x;
        // left
        while (true) {
          console.log("look left");
          currX--;
          let left = grid[currY][currX];
          let downLeft = grid[currY + 1][currX];
          if (left === SOLID) {
            hasLeftWall = true;
            break;
          } else {
            grid[currY][currX] = WATER;
          }
          if (!hasLeftWall && downLeft === EMPTY) {
            if (!streamsHasStream(currX, currY + 1)) {
              streams.push({ x: currX, top: currY + 1 });
            }
            break;
          }
        }
        currX = stream.x;
        // right
        while (true) {
          console.log("look right");
          currX++;
          let right = grid[currY][currX];
          let downRight = grid[currY + 1][currX];
          if (right === SOLID) {
            hasRightWall = true;
            break;
          } else {
            grid[currY][currX] = WATER;
          }
          if (!hasRightWall && downRight === EMPTY) {
            if (!streamsHasStream(currX, currY + 1)) {
              streams.push({ x: currX, top: currY + 1 });
            }
            break;
          }
        }
        if (hasLeftWall && hasRightWall) {
          currY--;
          grid[currY][currX] = WATER;
        } else {
          if (streams.length) {
            stream = streams.pop();
            resetState();
          } else {
            done = true;
          }
        }

        return;
      }

      function draw() {
        for (let y = 0; y < grid.length; y++) {
          for (let x = 0; x < grid[0].length; x++) {
            let type = grid[y][x];
            if (type === SOLID) {
              setPixel(x, y, 50, 50, 50);
            } else if (type === WATER) {
              setPixel(x, y, 30, 144, 255);
            } else if (type === EMPTY) {
              setPixel(x, y, 180, 180, 180);
            }
          }
        }

        setPixel(1419, 995, 255, 0, 0);

        ctx.putImageData(imageData, 0, 0);
      }

      function setPixel(x, y, r, g, b) {
        let idx = y * (WIDTH * 4) + x * 4;
        pixels[idx] = r;
        pixels[idx + 1] = g;
        pixels[idx + 2] = b;
        pixels[idx + 3] = x === currX && y === currY ? 255 : 155;
      }

      function resetState() {
        currY = stream.top;
        currX = stream.x;
        falling = true;
        seekDir = "left";
        hasLeftWall = false;
        hasRightWall = false;
      }

      function streamsHasStream(x, top) {
        return !!streams.find((stream) => stream.x === x && stream.top === top);
      }
    </script>
  </body>
</html>
