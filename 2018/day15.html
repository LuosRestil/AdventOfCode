<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2018 Day 15</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: rgb(30, 30, 30);
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas></canvas>
    <script type="module">
      let canvas = document.querySelector("canvas");
      let ctx = canvas.getContext("2d");

      let grid = await getGrid("day15.txt");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      ctx.fillStyle = "rebeccapurple";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // screen and grid sizing
      let dim = grid.length;
      let screenSize = Math.min(window.innerWidth, window.innerHeight);
      const cellSize = Math.floor(screenSize / dim);
      canvas.width = cellSize * dim * window.devicePixelRatio;
      canvas.height = cellSize * dim * window.devicePixelRatio;
      canvas.style.width = cellSize * dim + "px";
      canvas.style.height = cellSize * dim + "px";
      ctx.scale(devicePixelRatio, devicePixelRatio);

      let entities = getEntities(3);
      let iters = 0;
      let done = false;

      let tweens = [];
      let splats = [];
      let missiles = [];

      // loop setup
      let lastTimestamp = 0;
      let elapsed = 0;
      let framerate = 1 / 10;
      let tickGenerator = tick();
      requestAnimationFrame(loop);

      function loop(timestamp) {
        let dt = (timestamp - lastTimestamp) / 1000;
        elapsed += dt;
        lastTimestamp = timestamp;

        if (elapsed >= framerate && !done) {
          elapsed -= framerate;
          let res = tickGenerator.next();
          if (res.value) {
            done = true;
            entities = entities.filter((entity) => entity.hp > 0);
          }
          if (res.done) {
            tickGenerator = tick();
          }
        }

        update(dt);
        draw();

        if (!done || splats.length) {
          requestAnimationFrame(loop);
        } else {
          drawAnswer();
        }
      }

      function update(dt) {
        let filterTweens = false;
        for (let tween of tweens) {
          tween.update(dt);
          if (tween.complete) filterTweens = true;
        }
        if (filterTweens) tweens = tweens.filter((tween) => !tween.complete);

        for (let splat of splats) {
          splat.update(dt);
        }
        splats = splats.filter((splat) => !splat.dead);

        for (let missile of missiles) {
          missile.update(dt);
        }
        missiles = missiles.filter((missile) => missile.life > 0);
      }

      function draw() {
        ctx.fillStyle = "rgb(170,170,170)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = "black";
        for (let i = 0; i < grid.length; i++) {
          drawLine(i * cellSize, 0, i * cellSize, canvas.height);
          drawLine(0, i * cellSize, canvas.width, i * cellSize);
        }

        for (let row = 0; row < grid.length; row++) {
          for (let col = 0; col < grid[0].length; col++) {
            let char = grid[row][col];
            if (char === "#") {
              drawWall(col, row);
            }
          }
        }

        for (let entity of entities) {
          if (entity.hp > 0) {
            drawEntity(entity);
          }
        }
        splats.forEach((splat) => splat.draw());
        missiles.forEach((missile) => missile.draw());
      }

      function drawEntity(entity) {
        drawCircle(
          entity.displayX,
          entity.displayY,
          cellSize * 0.4,
          entity.type === "G" ? "green" : "dodgerblue",
        );
        ctx.font = `${cellSize * 0.4}px monospace`;
        ctx.fillStyle = "white";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(entity.hp, entity.displayX, entity.displayY);
      }

      function drawWall(x, y) {
        ctx.fillStyle = "saddlebrown";
        ctx.fillRect(x * cellSize, y * cellSize, cellSize, cellSize);
      }

      function drawLine(x1, y1, x2, y2, color = "black", width = 1) {
        ctx.strokeStyle = color;
        ctx.lineWidth = width;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
      }

      function drawCircle(x, y, radius, color) {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fill();
      }

      function drawAnswer() {
        ctx.fillStyle = "white";
        ctx.textAlign = "left";
        ctx.textBaseline = "alphabetic";
        let fontSize = canvas.width/100;
        ctx.font = `bold ${fontSize}px monospace`;
        let remainingHp = entities.reduce((acc, curr) => acc + curr.hp, 0);
        ctx.fillText(`Remaining HP: ${remainingHp}`, 10, fontSize*1.2);
        ctx.fillText(`Iterations: ${iters}`, 10, fontSize*1.2 + fontSize * 1.2);
        ctx.fillText(`Score: ${iters * remainingHp}`, 10, fontSize * 1.2 + fontSize * 1.2 + fontSize * 1.2);
      }

      async function getGrid(file) {
        const res = await fetch(`inputs/${file}`);
        const text = await res.text();
        return text.split("\n").map((row) => row.split(""));
      }

      function getEntities(elfAttackPower) {
        let entities = [];
        for (let row = 0; row < grid.length; row++) {
          for (let col = 0; col < grid[0].length; col++) {
            let char = grid[row][col];
            if (char === "G" || char === "E") {
              entities.push({
                row,
                col,
                displayX: col * cellSize + cellSize / 2,
                displayY: row * cellSize + cellSize / 2,
                hp: 200,
                power: char === "G" ? 3 : elfAttackPower,
                type: char,
              });
            }
          }
        }
        return entities;
      }

      function* tick() {
        entities.sort((a, b) =>
          a.row === b.row ? a.col - b.col : a.row - b.row,
        );
        // for each entity
        for (let entity of entities) {
          if (entity.hp <= 0) continue;
          // get adjacent enemies
          let adjacentEnemies = getAdjacentEnemies(entity);
          if (!adjacentEnemies.length) {
            // get enemies
            let enemies = getAllEnemies(entity);
            // if no enemies, we're done
            if (!enemies.length) {
              return true;
            }
            // get cells adjacent to enemies
            let cells = getCellsAdjacentToEnemies(enemies);
            // get shortest paths to each cell
            let shortestDist = Infinity;
            let nearestCells = [];
            for (let cell of cells) {
              let dist = getShortestDistance(entity, cell);
              if (dist === null) continue;
              if (dist < shortestDist) {
                nearestCells = [cell];
                shortestDist = dist;
              } else if (dist === shortestDist) {
                nearestCells.push(cell);
              }
            }
            if (!nearestCells.length) continue;
            nearestCells.sort((a, b) =>
              a.row === b.row ? a.col - b.col : a.row - b.row,
            );
            let destination = nearestCells[0];
            let neighbors = [
              // reading order
              { row: entity.row - 1, col: entity.col }, // up
              { row: entity.row, col: entity.col - 1 }, // left
              { row: entity.row, col: entity.col + 1 }, // right
              { row: entity.row + 1, col: entity.col }, // down
            ];
            let move = null;
            for (let neighbor of neighbors) {
              if (grid[neighbor.row][neighbor.col] !== ".") {
                continue;
              }
              let dist = getShortestDistance(neighbor, destination);
              if (dist === shortestDist - 1) {
                move = neighbor;
                break;
              }
            }
            // move to first step of first path
            grid[entity.row][entity.col] = ".";
            entity.row = move.row;
            entity.col = move.col;
            tweens.push(
              new Tween(
                entity,
                "displayX",
                entity.col * cellSize + cellSize / 2,
                framerate,
              ),
            );
            tweens.push(
              new Tween(
                entity,
                "displayY",
                entity.row * cellSize + cellSize / 2,
                framerate,
              ),
            );
            grid[entity.row][entity.col] = entity.type;
            // recheck for adjacent enemies
            adjacentEnemies = getAdjacentEnemies(entity, enemies);
            yield;
          }
          // if no enemies are adjacent
          if (!adjacentEnemies.length) continue;
          // sort adjacent enemies by hp, then reading order
          adjacentEnemies.sort((a, b) => {
            if (a.hp === b.hp) {
              if (a.row === b.row) {
                return a.col - b.col;
              }
              return a.row - b.row;
            }
            return a.hp - b.hp;
          });
          // attack first adjacent enemy
          let target = adjacentEnemies[0];
          target.hp -= entity.power;
          missiles.push(
            new Particle(
              entity.displayX,
              entity.displayY,
              Math.sign(target.col - entity.col) * cellSize * 4,
              Math.sign(target.row - entity.row) * cellSize * 4,
              cellSize / 5,
              entity.type === "G" ? "firebrick" : "yellow",
              0.25,
            ),
          );
          if (target.hp <= 0) {
            grid[target.row][target.col] = ".";
            splats.push(
              new Splat(
                target.displayX,
                target.displayY,
                target.type === "G" ? "green" : "dodgerblue",
              ),
            );
          }
          yield;
        }

        entities = entities.filter((entity) => entity.hp > 0);
        iters++;
      }

      function getAllEnemies(entity) {
        let enemies = [];
        for (let other of entities) {
          if (other.hp <= 0) continue;
          if (entity.type !== other.type) {
            enemies.push(other);
          }
        }
        return enemies;
      }

      function getAdjacentEnemies(entity) {
        let adjacentEnemies = [
          entities.find(
            (e) => e.row === entity.row - 1 && e.col === entity.col,
          ),
          entities.find(
            (e) => e.row === entity.row + 1 && e.col === entity.col,
          ),
          entities.find(
            (e) => e.row === entity.row && e.col === entity.col - 1,
          ),
          entities.find(
            (e) => e.row === entity.row && e.col === entity.col + 1,
          ),
        ].filter((e) => e?.hp > 0 && e.type !== entity.type);
        return adjacentEnemies;
      }

      function getCellsAdjacentToEnemies(enemies) {
        let cells = [];
        for (let enemy of enemies) {
          // up
          if (grid[enemy.row - 1][enemy.col] === ".") {
            cells.push({ row: enemy.row - 1, col: enemy.col });
          }
          // down
          if (grid[enemy.row + 1][enemy.col] === ".") {
            cells.push({ row: enemy.row + 1, col: enemy.col });
          }
          // left
          if (grid[enemy.row][enemy.col - 1] === ".") {
            cells.push({ row: enemy.row, col: enemy.col - 1 });
          }
          // right
          if (grid[enemy.row][enemy.col + 1] === ".") {
            cells.push({ row: enemy.row, col: enemy.col + 1 });
          }
        }
        return cells;
      }

      function getShortestDistance(src, dest) {
        let openSet = [{ row: src.row, col: src.col, from: [], depth: 0 }];
        let closedSet = {};
        while (openSet.length) {
          let winner = 0;
          let winnerF = Infinity;
          for (let i = 0; i < openSet.length; i++) {
            let f = openSet[i].depth + manhattanDistance(openSet[i], dest);
            if (f < winnerF) {
              winnerF = f;
              winner = i;
            }
          }
          let curr = openSet.splice(winner, 1)[0];

          if (curr.row === dest.row && curr.col === dest.col) {
            return curr.depth;
          }

          if (!closedSet[curr.row]) closedSet[curr.row] = {};
          closedSet[curr.row][curr.col] = true;

          let neighbors = [
            { row: curr.row - 1, col: curr.col },
            { row: curr.row + 1, col: curr.col },
            { row: curr.row, col: curr.col - 1 },
            { row: curr.row, col: curr.col + 1 },
          ];
          for (let neighbor of neighbors) {
            let char = grid[neighbor.row][neighbor.col];
            if (char !== ".") {
              continue;
            }
            if (closedSet[neighbor.row]?.[neighbor.col]) continue;
            neighbor.depth = curr.depth + 1;
            neighbor.from = curr;
            let existing = openSet.find(
              (elem) => elem.row === neighbor.row && elem.col === neighbor.col,
            );
            if (existing) {
              if (neighbor.depth < existing.depth) {
                existing.depth = neighbor.depth;
                existing.from = curr;
              }
            } else {
              openSet.push(neighbor);
            }
          }
        }
        return null;
      }

      function manhattanDistance(a, b) {
        return Math.abs(a.row - b.row) + Math.abs(a.col - b.col);
      }

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      class Tween {
        constructor(obj, prop, target, duration, delay = 0, callback = null) {
          this.ease = (t) =>
            t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
          this.elapsed = 0;
          this.complete = false;
          this.obj = obj;
          this.prop = prop;
          this.startVal = obj[prop];
          this.target = target;
          this.duration = duration;
          this.delay = delay;
          this.callback = callback;
          return this;
        }

        update(dt) {
          if (this.delay >= 0) {
            this.delay -= dt;
            if (this.delay < 0) {
              this.elapsed -= this.delay;
            }
          } else {
            this.elapsed += dt;
            if (this.elapsed > this.duration) {
              this.elapsed = this.duration;
              this.complete = true;
              if (this.callback) this.callback();
            }
            this.obj[this.prop] = lerp(
              this.startVal,
              this.target,
              this.ease(this.elapsed / this.duration),
            );
          }
        }
      }

      class Splat {
        particles = [];
        dead = false;
        particleMaxSpeed = 80;

        constructor(x, y, color) {
          this.x = x;
          this.y = y;
          for (let i = 0; i < 8; i++) {
            this.particles.push(
              new Particle(
                this.x,
                this.y,
                Math.random() * this.particleMaxSpeed * 2 -
                  this.particleMaxSpeed,
                Math.random() * this.particleMaxSpeed * 2 -
                  this.particleMaxSpeed,
                cellSize / 10,
                color,
              ),
            );
          }
        }

        update(dt) {
          for (let particle of this.particles) {
            particle.update(dt);
          }
          if (this.particles.every((particle) => particle.life <= 0)) {
            this.dead = true;
          }
        }

        draw() {
          for (let particle of this.particles) {
            if (particle.life > 0) particle.draw();
          }
        }
      }

      class Particle {
        constructor(x, y, dx, dy, radius, color, life) {
          this.x = x;
          this.y = y;
          this.dx = dx;
          this.dy = dy;
          this.radius = radius;
          this.color = color;
          this.life = life ?? Math.random();
        }

        update(dt) {
          this.x += this.dx * dt;
          this.y += this.dy * dt;
          this.life -= dt;
        }

        draw() {
          drawCircle(this.x, this.y, this.radius, this.color);
        }
      }
    </script>
  </body>
</html>
